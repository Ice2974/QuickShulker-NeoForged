plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

def commonProject = project(':common')

base {
    archivesName = archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(neoforge_java_version as int)
    }
    withSourcesJar()
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        compileClasspath += commonProject.sourceSets.main.output
        runtimeClasspath += commonProject.sourceSets.main.output
    }
}

dependencies {
    implementation commonProject
}

processResources {
    def replaceProperties = [
        mod_id                          : mod_id,
        mod_name                        : mod_name,
        mod_version                     : mod_version,
        mod_license                     : mod_license,
        mod_authors                     : mod_authors,
        mod_description                 : mod_description,
        neoforge_version                : neoforge_version,
        neoforge_fml_version_range      : neoforge_fml_version_range,
        neoforge_loader_version_range   : neoforge_loader_version_range,
        neoforge_minecraft_version_range: neoforge_minecraft_version_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from(commonProject.sourceSets.main.output)
    archiveFileName = "QuickShulker-NeoForge-v${project.version}-mc${neoforge_minecraft_version}.jar"
}

tasks.named('sourcesJar', Jar).configure {
    from(commonProject.sourceSets.main.allSource)
}
